# docker-compose.ticket.yml — one Odoo web container per ticket.
#
# The ticket's Postgres lives in the main stack (docker-compose.yml); this file
# only defines the web service, attached to the main stack's external network
# so that the DB hostname `db` resolves. The filestore volume is per ticket and
# is seeded by `scripts/ticket.sh new`.
#
# Required in .env (generated by scripts/ticket.sh):
#   COMPOSE_PROJECT_NAME=tkt-<slug>
#   COMPOSE_FILE=docker-compose.ticket.yml
#   WEB_PORT=<8100-8499>
#   MAIN_NETWORK=<main project>_odoo-network
#   IMAGE_TAG=soltec-localdev-odoo19:1.0
services:
  web:
    image: ${IMAGE_TAG:-soltec-localdev-odoo19:1.0}
    ports:
      - "${WEB_PORT:?WEB_PORT is required}:8069"
    command:
      - "--addons-path=/mnt/custom-addons,/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons"
    volumes:
      - ./custom-addons:/mnt/custom-addons
      - odoo-web-data:/var/lib/odoo
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    networks:
      - odoo-network

volumes:
  odoo-web-data:

networks:
  odoo-network:
    external: true
    name: ${MAIN_NETWORK:?MAIN_NETWORK is required}
