services:
  web:
    build:
      context: .
    image: soltec-localdev-odoo19:1.0
    depends_on:
      - db
    ports:
      - "${WEB_PORT:-8070}:8069"
    command:
      - "--addons-path=/mnt/custom-addons,/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons"
      - "--workers=0"
    volumes:
      - ./custom-addons:/mnt/custom-addons
      - odoo-web-data:/var/lib/odoo
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=odoo
    networks:
      - odoo-network

  db:
    image: postgres:14
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=odoo
      - POSTGRES_DB=postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - odoo-network

  # Optional CPU embedding sidecar for l10n_ar_invoice_match (profile:
  # embedding). Odoo reaches it as http://embedding:8000; the host port is
  # bound to localhost only. See submodules/odoo-ocr/sidecar/embedding/.
  embedding:
    build:
      context: ./submodules/odoo-ocr/sidecar/embedding
      args:
        EMBEDDING_MODEL: ${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
        EMBEDDING_MODEL_FILE: ${EMBEDDING_MODEL_FILE:-onnx/model_O4.onnx}
        EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
    image: soltec-localdev-embedding:1.0
    profiles:
      - embedding
    environment:
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-intfloat/multilingual-e5-small}
      - EMBEDDING_MODEL_FILE=${EMBEDDING_MODEL_FILE:-onnx/model_O4.onnx}
      - EMBEDDING_DIM=${EMBEDDING_DIM:-384}
    ports:
      - "127.0.0.1:${EMBEDDING_PORT:-8081}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - odoo-network

  pgadmin:
    image: dpage/pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@hola.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    depends_on:
      - db
    ports:
      - "${PGADMIN_PORT:-5051}:80"
    networks:
      - odoo-network
    volumes:
      - pgadmin-data:/var/lib/pgadmin

volumes:
  odoo-web-data:
  postgres-data:
  pgadmin-data:

networks:
  odoo-network:
