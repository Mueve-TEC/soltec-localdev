# pre-commit supermódulo — soltec-localdev-odoo19
#
# ALCANCE IMPORTANTE: pre-commit usa el `.pre-commit-config.yaml` del
# toplevel del repositorio git. En el supermódulo, `git ls-files` sólo
# trackea cada submódulo como un gitlink (puntero a commit), NO sus
# archivos internos. Por lo tanto `pre-commit run --all-files` aquí SÓLO
#escanea los archivos de infra del supermódulo:
#   Dockerfile, docker-compose.yml, Makefile, copy_addons.sh, README.md,
#   AGENTS.md, pyproject.toml, .pre-commit-config.yaml, docker/*.sh, exclude.txt
#
# NO cubre el código dentro de submodules/<repo>/... — ese vive en repos
# git separados. Para lintearlos:
#   * submodules/odoo-argentina/  → `make lint-odoo-ar` (tiene su propio config, ver AGENTS.md)
#   * submodules/bank-statement-import/ , account-reconcile/  → `cd <repo> && pre-commit run --all-files`
#   * submodules/odoo-union/ , odooapps/  → sin config propio; usar `ruff check <path>` manualmente
#
# Instalación (una vez):  pre-commit install
# Uso manual:             pre-commit run --all-files   (o `make lint`)

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.13.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: prettier
        name: prettier (with plugin-xml)
        entry: prettier
        args:
          - --write
          - --list-different
          - --ignore-unknown
        types: [text]
        files: \.(css|htm|html|js|json|jsx|less|md|scss|toml|xml|yaml|yml)$
        language: node
        additional_dependencies:
          - "prettier@3.6.2"
          - "@prettier/plugin-xml@3.4.2"

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-xml
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
      - id: mixed-line-ending
        args: ["--fix=lf"]
